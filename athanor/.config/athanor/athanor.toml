[place]
# Without this, the planetary hours assume sunrise at 6:00 and sunset at 18:00.
# latitude = 40.71
# longitude = -74.01

[character]
# name defaults to your login name and race to your distro.
# name = "Prospero"
title = "the Wizard"
# race = "Fedora Linux"

[room]
name = "A Dim Chamber"
description = "Dust hangs in the lamplight. A terminal hums on the desk."

[room.exits]
# Listed under the room as its obvious exits.
# north = "~/projects"
# down = "~/notes"

[display]
# Screen pixels per wallpaper pixel. 0 picks 2 (3 at 4K).
pixel_scale = 0
# A plate for each workspace. false keeps level 1's on all of them.
levels = true
# Fuentes disponibles para la terminal (aplican en el próximo transmute):
# tandy, terminus, terminess, cozette, compaq, vga, proggy, proggyclean,
# departure, departuremono, iosevka, iosevkaterm.
terminal_font = "terminus"
# Terminal font size in px. 0 uses the face's native size. The pixel faces
# (tandy, compaq, vga) snap to the nearest multiple of their grid (16, 32,
# 48...); terminus and cozette scale freely. Applies at the next transmute.
terminal_size = 20

[transmute]
# Change scheme with the time of day: umber at night, then vellum, orpiment
# and cinnabar through the daylight hours.
stages = false

[tarot]
on_login = true
